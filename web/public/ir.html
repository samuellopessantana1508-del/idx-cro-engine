<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Abrindo WhatsApp…</title>
<style>
  body{margin:0;background:#0a0a0a;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif;display:grid;place-items:center;min-height:100vh}
  .box{text-align:center;opacity:.85}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#25D366;margin-right:8px;animation:p 1s infinite}
  @keyframes p{0%,100%{opacity:.3}50%{opacity:1}}
</style>
</head>
<body>
<div class="box"><span class="dot"></span>Abrindo WhatsApp…</div>
<script>
(function(){
  var qs = new URLSearchParams(location.search);
  var ref = (qs.get("r") || "").slice(0, 32);
  var to = qs.get("u") || "";
  // Só permite redirecionar para o WhatsApp (evita open-redirect).
  if (to.indexOf("https://wa.me/") !== 0 && to.indexOf("https://api.whatsapp.com/") !== 0) { to = ""; }
  var confirmUrl = "https://tykeycwworjtfpssjevw.supabase.co/functions/v1/go/confirm?ref=" + encodeURIComponent(ref);
  var sent = false;
  function confirmEntry(){
    if (sent || !ref) return;
    sent = true;
    try { if (navigator.sendBeacon && navigator.sendBeacon(confirmUrl, new Blob())) return; } catch(e){}
    try { fetch(confirmUrl, { method:"POST", keepalive:true, mode:"no-cors" }); } catch(e){}
  }
  // Confirma no momento em que o navegador realmente sai para o WhatsApp.
  addEventListener("pagehide", confirmEntry);
  document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "hidden") confirmEntry(); });
  if (to) { location.replace(to); }
  else { document.querySelector(".box").textContent = "Link inválido. Fale com a empresa."; }
})();
</script>
<noscript>Ative o JavaScript para continuar até o WhatsApp.</noscript>
</body>
</html>
