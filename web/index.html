<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      // formulário público em /f/<endereço>: os arquivos do site ficam na raiz (base "./" do build)
      if (/^\/f\//.test(location.pathname)) document.write('<base href="/">');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="10" fill="%230a0a0a"/><text x="32" y="40" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="white">IDX</text></svg>' />
    <title>IDX CRO Engine</title>
    <script>
      // formulário público (/f/...): o cliente final não vê o nome nem o ícone do CRO
      if (/^\/f\//.test(location.pathname)) { document.title = "\u200e"; document.querySelector('link[rel="icon"]').remove(); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
